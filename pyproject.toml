[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batten-spline"
version = "0.1.0"
description = "Distance-weighted interpolation for cascade routing in AI systems."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SuperInstance"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
batten-spline = "batten_spline.cli:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/batten-spline"
Repository = "https://github.com/SuperInstance/batten-spline"
Issues = "https://github.com/SuperInstance/batten-spline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
